<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="img/icono-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cierra tu Venta · Titán</title>
<meta name="theme-color" content="#0f1115">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a; --txt:#eef0f4; --muted:#9097a6;
  --acc:#f59e0b; --acc2:#fbbf24; --ok:#22c55e; --warn:#eab308; --bad:#ef4444; --blue:#60a5fa; --green:#34d399;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* ------- login ------- */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.login-box{width:100%;max-width:360px;padding:28px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--acc)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#3a4150}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#111}
.btn.pri:hover{background:var(--acc2)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
/* ------- layout ------- */
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.hbar .brand{font-size:17px}
.sp{flex:1}
.who{color:var(--muted);font-size:12px;text-align:right}
.tabs{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--txt);border-color:var(--acc)}
main{max-width:1180px;margin:0 auto;padding:16px 16px 80px}
h2{font-size:18px;margin:0;letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#111}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:2px;color:var(--muted)}
.up{color:var(--ok)!important}.down{color:var(--bad)!important}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--panel2);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
th.ord{cursor:pointer;user-select:none}th.ord:hover{color:var(--txt)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody tr.sel{background:#2a2312}
tr:last-child td{border-bottom:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.pill.ok{background:#12351f;color:var(--ok)}.pill.warn{background:#3a3210;color:var(--warn)}.pill.bad{background:#3d1515;color:var(--bad)}.pill.n{background:var(--panel2);color:var(--muted)}
.bot-tag{font-size:10px;background:#1d2b44;color:var(--blue);padding:1px 6px;border-radius:6px;margin-left:6px;font-weight:700}
.section{margin-top:18px}
.section-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.note{font-size:12px;color:var(--muted)}
.banner{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.bad{border-color:#5b2020;background:#221213}
.banner.ok{border-color:#1f4a2e}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font-size:10px;font-family:Inter,sans-serif}
/* ------- flujos ------- */
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.fcard:hover{border-color:#3a4150}
.fcard .t{font-weight:700}
.fcard .s{font-size:12px;color:var(--muted);line-height:1.45}
.fcard .f{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:auto}
.tpl{border-style:dashed}
.sw{position:relative;width:38px;height:22px;flex:none}
.sw input{display:none}
.sw span{position:absolute;inset:0;background:#3a4150;border-radius:99px;transition:.15s}
.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span:before{transform:translateX(16px)}
/* canvas */
.canvas{background:
  radial-gradient(circle,#232833 1px,transparent 1px) 0 0/18px 18px, var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:22px 12px 30px;display:flex;flex-direction:column;align-items:center}
.node{width:100%;max-width:440px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid;border-radius:12px;padding:12px;position:relative}
.node.trig{border-left-color:var(--acc)}
.node.cond{border-left-color:var(--blue)}
.node.act{border-left-color:var(--green)}
.node .nh{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.node.trig .nh{color:var(--acc)}.node.cond .nh{color:var(--blue)}.node.act .nh{color:var(--green)}
.node .x{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.node .x:hover{color:var(--bad)}
.node select{margin-bottom:8px}
.node .help{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
.wire{width:2px;height:22px;background:#3a4150;position:relative}
.wire:after{content:"";position:absolute;bottom:-4px;left:-4px;border:5px solid transparent;border-top-color:#3a4150}
.add{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;justify-content:center}
.add .btn{border-style:dashed;background:transparent;font-size:12px;padding:6px 10px}
.end{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:6px 14px}
.editor-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-bottom:12px}
.opts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0 14px;font-size:13px}
.opts label{margin:0;display:flex;gap:8px;align-items:center;color:var(--txt);font-size:13px}
.opts input[type=checkbox]{width:auto}
/* ------- conocimiento / inventario ------- */
.kb{display:flex;flex-direction:column;gap:10px}
.kbi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.invc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.invc .t{font-weight:700;display:flex;gap:8px;align-items:baseline}
.invc .p{color:var(--acc);font-weight:700;margin-left:auto;font-size:13px;white-space:nowrap}
.col{margin-top:8px;font-size:12px}
.col b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.tz{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin:0 4px 4px 0;font-variant-numeric:tabular-nums}
.tz.low{border-color:#6b4b10;color:var(--acc2)}
/* ------- modal ------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:620px;padding:18px}
.modal h3{margin:0 0 4px;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
/* ------- chats: estilo WhatsApp (modo oscuro) ------- */
:root{--wa-bg:#0b141a;--wa-panel:#111b21;--wa-head:#202c33;--wa-in:#202c33;--wa-out:#005c4b;--wa-txt:#e9edef;--wa-sub:#8696a0;--wa-verde:#00a884;--wa-azul:#53bdeb;--wa-linea:#222d34;--wa-hover:#202c33;--wa-sel:#2a3942}
.chats{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 150px);min-height:480px;border-radius:12px;overflow:hidden;border:1px solid var(--wa-linea)}
.clist{background:var(--wa-panel);overflow:auto;border-right:1px solid var(--wa-linea)}
.citem{padding:10px 14px;cursor:pointer;display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;border-bottom:1px solid var(--wa-linea)}
.citem:hover{background:var(--wa-hover)}.citem.on{background:var(--wa-sel)}
.ava{width:48px;height:48px;border-radius:50%;background:#6b7c85;color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.citem .r1{display:flex;gap:8px;align-items:center}.citem .n{font-weight:500;font-size:15.5px;color:var(--wa-txt);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .t{font-size:12px;color:var(--wa-sub)}.citem .t.nuevo{color:var(--wa-verde)}
.citem .r2{display:flex;gap:6px;align-items:center;margin-top:2px}
.citem .m{font-size:13.5px;color:var(--wa-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.citem .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;background:#2a3942;color:var(--wa-sub);white-space:nowrap}
.badge.v{background:#0b3d2e;color:#25d366}.badge.p{background:#3a3210;color:var(--warn)}.badge.d{background:#1d2b44;color:var(--blue)}
.badge.u{background:var(--wa-verde);color:#111b21;min-width:20px;text-align:center;border-radius:99px;font-size:11px;font-weight:700}
.cview{background:var(--wa-bg);display:flex;flex-direction:column;min-height:0;position:relative}
.chead{padding:8px 14px;background:var(--wa-head);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chead .n{font-weight:500;font-size:16px;color:var(--wa-txt)}
.chead .note{color:var(--wa-sub)}
.chead .ava{width:40px;height:40px;font-size:15px;flex:none}
.cnom{flex:1;min-width:140px}.cacc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cbody{flex:1;overflow:auto;padding:14px 6%;display:flex;flex-direction:column;gap:2px;background-color:var(--wa-bg);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px}
.dia{align-self:center;background:#182229;color:var(--wa-sub);font-size:12px;padding:5px 12px;border-radius:8px;margin:10px 0;text-transform:uppercase;letter-spacing:.02em}
.bub{position:relative;max-width:65%;padding:6px 8px 8px 9px;border-radius:8px;font-size:14.2px;line-height:19px;color:var(--wa-txt);white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px .5px rgba(11,20,26,.13);margin-top:2px;cursor:pointer}
.bub.in{align-self:flex-start;background:var(--wa-in)}
.bub.out{align-self:flex-end;background:var(--wa-out)}
.bub.cola.in{border-top-left-radius:0;margin-top:8px}.bub.cola.out{border-top-right-radius:0;margin-top:8px}
.bub.cola.in:before,.bub.cola.out:before{content:"";position:absolute;top:0;width:8px;height:13px}
.bub.cola.in:before{left:-8px;background:linear-gradient(to bottom left,var(--wa-in) 50%,transparent 50%)}
.bub.cola.out:before{right:-8px;background:linear-gradient(to bottom right,var(--wa-out) 50%,transparent 50%)}
.bub .meta{float:right;font-size:11px;color:rgba(233,237,239,.6);margin:6px 0 -4px 10px;white-space:nowrap;display:flex;gap:3px;align-items:center}
.bub .autor{display:block;font-size:12.5px;font-weight:600;color:#ffd279;margin-bottom:2px}
.bub .autor.bot{color:#7fdbca}
.chk{font-size:12px;letter-spacing:-4px;margin-right:4px;color:rgba(233,237,239,.6)}.chk.leido{color:var(--wa-azul)}.chk.fallo{color:#f15c6d;letter-spacing:0;margin-right:0}
.bub img{max-width:260px;border-radius:6px;display:block;margin:-2px -4px 4px}
.bub audio{max-width:250px;display:block}
.bub.sel{box-shadow:0 0 0 2px var(--wa-verde)}
.bub.borrado{font-style:italic;color:var(--wa-sub);background:transparent;border:1px dashed #33424b;cursor:default;font-size:13px}
.cita{border-left:4px solid #06cf9c;background:rgba(0,0,0,.18);padding:5px 8px;border-radius:6px;font-size:13px;color:var(--wa-sub);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cdatos{margin:10px 6% 0;padding:10px 12px;border:1px solid #0b3d2e;background:#0d211b;border-radius:8px;font-size:12.5px;color:var(--wa-txt);display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 14px}
.cdatos b{color:var(--wa-sub);font-weight:500;font-size:11px;display:block}
.cfoot{background:var(--wa-head);padding:8px 10px;display:flex;gap:6px;align-items:flex-end}
.cfoot textarea{min-height:42px;max-height:140px;background:#2a3942;border:none;border-radius:8px;color:var(--wa-txt);padding:11px 12px;font-size:15px;line-height:20px}
.cfoot textarea:focus{border:none}
.wabtn{width:42px;height:42px;border-radius:50%;border:none;background:transparent;color:var(--wa-sub);font-size:20px;display:grid;place-items:center;cursor:pointer;flex:none;touch-action:none;user-select:none}
.wabtn:hover{color:var(--wa-txt)}.wabtn.enviar{background:var(--wa-verde);color:#111b21;font-size:18px}
.wabtn.grabando{background:#f15c6d;color:#fff;transform:scale(1.25);position:relative;z-index:5}
.grabbar{position:absolute;left:0;right:0;bottom:0;background:var(--wa-head);height:58px;display:flex;align-items:center;gap:14px;padding:0 70px 0 18px;color:var(--wa-txt);z-index:3;pointer-events:none}
.grabbar .punto{width:10px;height:10px;border-radius:50%;background:#f15c6d;animation:lat 1s infinite}
.grabbar .desliza{margin:0 auto;color:var(--wa-sub);font-size:14px;transition:transform .05s}
.grabbar.cancelar .desliza{color:#f15c6d}
@keyframes lat{50%{opacity:.35}}
.asig{width:auto;padding:6px 8px;font-size:12px;background:#2a3942;border:none;color:var(--wa-txt)}
.chead .btn{background:#2a3942;border:none;color:var(--wa-txt)}.chead .btn.pri{background:var(--wa-verde);color:#111b21}
.acc{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;clear:both}
.acc .btn{background:rgba(0,0,0,.25);border:none;color:var(--wa-txt)}
.respbar{display:flex;gap:8px;align-items:center;padding:8px 10px 0;background:var(--wa-head)}
.doc{display:flex;gap:8px;align-items:center;padding:8px 10px;background:rgba(0,0,0,.2);border-radius:6px;color:var(--wa-txt);text-decoration:none}
.rrpop{position:absolute;left:10px;right:10px;bottom:62px;background:#233138;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.5);max-height:260px;overflow:auto;z-index:4}
.rrpop .it{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--wa-linea)}
.rrpop .it:hover,.rrpop .it.on{background:#2a3942}
.rrpop .it b{color:var(--wa-verde);font-weight:600;margin-right:8px}
.rrpop .it span{color:var(--wa-sub);font-size:13px}
.rrpop .vacio{padding:12px 14px;color:var(--wa-sub);font-size:13px}
/* --- encabezado de la bandeja (buscador + filtros tipo WhatsApp) --- */
.lhead{padding:12px 14px 6px;position:sticky;top:0;background:var(--wa-panel);z-index:2}
.ltit{font-size:22px;font-weight:700;color:var(--wa-txt);letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.ltit small{font-size:12px;font-weight:500;color:var(--wa-sub)}
.buscar{display:flex;align-items:center;gap:8px;background:#202c33;border-radius:10px;padding:0 12px;margin:10px 0 8px;color:var(--wa-sub)}
.buscar input{background:transparent;border:none;padding:9px 0;color:var(--wa-txt);font-size:15px}
.buscar input:focus{border:none}
.wachips{display:flex;flex-wrap:wrap;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.wachips::-webkit-scrollbar{display:none}
.wachips button{flex:none;background:transparent;border:1px solid #2f3b43;color:var(--wa-sub);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer}
.wachips button.on{background:#0a332c;border-color:#0a332c;color:#d9fdd3}
.tab i{font-style:normal;display:none;position:relative}.tab .tc{display:none}
.tab i b{position:absolute;top:-6px;right:-12px;background:#25d366;color:#000;font-size:11px;font-weight:700;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px;border:2px solid #000}

/* ===================== MÓVIL: estilo WhatsApp iPhone ===================== */
@media (max-width:760px){
  :root{--wa-bg:#0b0b0b;--wa-panel:#000;--wa-head:#161616;--wa-in:#262628;--wa-out:#144d37;--wa-linea:#242426;--wa-hover:#111;--wa-sel:#1c1c1e;--wa-sub:#8e8e93;--wa-txt:#fff;--wa-verde:#25d366}
  body{background:#000}
  main{padding:0 16px 110px}
  /* barra inferior flotante con íconos */
  .tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:none;margin:0;padding:6px;z-index:30;
    background:rgba(28,28,30,.82);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid rgba(255,255,255,.08);border-radius:34px;justify-content:space-around;gap:0;box-shadow:0 10px 30px rgba(0,0,0,.5)}

const auth = firebase.auth();

auth.onAuthStateChanged(async (user) => {
  store.del('ctv_session'); // la sesión vieja con PIN ya no sirve

  try {

const D = { reparto: null, repartoHoy: null, convs: null, pedidos: null, publi: null, publiEstado: null, bot: null, flujos: null, kb: null, productos: null, usuarios: [] };
function suscribir() {
  const desde = diasAtras(62);
  // La vendedora solo puede consultar sus propios pedidos (reglas de Firebase)
  const qPed = esAdmin() ? db.ref(`${R}/pedidos`).orderByChild('fecha').startAt(desde) : db.ref(`${R}/pedidos`).orderByChild('vendedorId').equalTo(CU.id);
  qPed.on('value', (s) => { D.pedidos = vals(s.val()).filter((p) => !p.fecha || p.fecha >= desde); if (TAB === 'vend') renderVend(); });
  // Publicidad: la escribe el flujo de n8n "Titán — Publicidad Flujo A" (un registro por día)
  db.ref(`${R}/publicidad/historico`).orderByKey().startAt(desde).on('value', (s) => { D.publi = s.val() || {}; if (TAB === 'vend') renderVend(); });
  db.ref(`${R}/publicidad/snapshot/updatedAt`).on('value', (s) => { D.publiEstado = s.val(); if (TAB === 'vend') renderVend(); });
  db.ref(`${R}/metricas/bot/dias`).orderByKey().startAt(desde).on('value', (s) => { D.bot = s.val() || {}; if (TAB === 'vend') renderVend(); });
  // El vendedor solo puede consultar los chats asignados a él (reglas de Firebase)
  const qConv = esAdmin() ? db.ref(`${R}/conversaciones`) : db.ref(`${R}/conversaciones`).orderByChild('asignadoA').equalTo(CU.id);
  qConv.on('value', (s) => { D.convs = s.val() || {}; pintarTabs(); if (TAB === 'chats') renderChats(); });
  db.ref(`${R}/config/etiquetas`).on('value', (s) => { D.etiquetas = s.val() || {}; if (TAB === 'chats') renderChats(); if (MENU) pintarMenu(); });
  if (esAdmin()) db.ref(`${R}/config/ctv/mediosMigrados`).once('value').then((s) => {
    // Una sola vez: pasar los archivos viejos fuera de los mensajes para que el CTV cargue rápido
    // Se repite cada hora mientras no conste que terminó (por si la función aún no estaba publicada)
    if (!s.val() && Date.now() - (Number(store.get('ctv_migrar_pedido')) || 0) > 3600000)
      db.ref(`${R}/ctv/migrarMedios`).push({ por: CU.nombre, at: Date.now() }).then(() => store.set('ctv_migrar_pedido', Date.now())).catch(() => {});
  }).catch(() => {});
  db.ref(`${R}/publicidad/anuncios`).on('value', (s) => { D.anuncios = s.val() || {}; if (TAB === 'chats') renderChats(); if (TAB === 'reparto' && !REP_EDIT) renderReparto(); });
  db.ref(`${R}/config/respuestasRapidas`).on('value', (s) => { D.rr = s.val() || {}; if (TAB === 'kb' && !KB_EDIT) renderKB(); });
  db.ref(`${R}/usuarios`).once('value').then((s) => { D.usuarios = vals(s.val()); if (TAB === 'reparto') renderReparto(); })
    .catch(() => { D.usuarios = [{ id: CU.id, nombre: CU.nombre, rol: CU.rol, nombrePubli: CU.nombrePubli }]; });
  if (esAdmin()) {
    db.ref(`${R}/config/reparto`).on('value', (s) => { D.reparto = s.val() || {}; if (TAB === 'reparto' && !REP_EDIT) renderReparto(); });
    db.ref(`${R}/reparto/dias/${hoyIso()}`).on('value', (s) => { D.repartoHoy = s.val() || {}; if (TAB === 'reparto' && !REP_EDIT) renderReparto(); });
    db.ref(`${R}/config/flujos`).on('value', (s) => { D.flujos = s.val() || {}; if (TAB === 'flujos' && !EDIT) renderFlujos(); });
    db.ref(`${R}/config/conocimiento`).on('value', (s) => { D.kb = s.val() || {}; if (TAB === 'kb' && !KB_EDIT) renderKB(); });
  }
}

/* =====================================================================
   1. VENDEDORES — mensajes de Meta vs ventas de bodega
   ===================================================================== */
const RANGOS = { hoy: ['Hoy', 0, 0], ayer: ['Ayer', 1, 1], d7: ['7 días', 6, 0], d30: ['30 días', 29, 0] };
let RANGO = store.get('ctv_rango') || 'd7';
let VSEL = null; // vendedor seleccionado para el gráfico

function rangoFechas(k) { const [, a, b] = RANGOS[k]; return [diasAtras(a), diasAtras(b)]; }
function rangoPrevio(k) { const [, a, b] = RANGOS[k]; const n = a - b + 1; return [diasAtras(a + n), diasAtras(b + n)]; }

const esVenta = (p) => p && p.estado !== 'cancelado' && p.tipoVenta !== 'cambio';
const paresDe = (p) => Number(p.cantidadPares) || vals(p.items).reduce((s, i) => s + (Number(i.cantidad) || 1), 0) || 1;

/** Clave de vendedor: nombre de publicidad si existe, si no la primera palabra. */
function claveVendedor(nombre, vendedorId) {
  const u = D.usuarios.find((x) => x.id === vendedorId);
  return normVend(u?.nombrePubli || nombre);
}

/** Agrega por vendedor y por día. */
function agregar(desde, hasta) {
  const V = {}; // clave -> {nombre, mensajes, ventas, pares, valor, gasto, dias:{}}
  const get = (k, nombre) => (V[k] = V[k] || { clave: k, nombre: nombre || k, mensajes: 0, ventas: 0, pares: 0, valor: 0, gasto: 0, dias: {}, bot: false });
  const dia = (o, f) => (o.dias[f] = o.dias[f] || { mensajes: 0, ventas: 0, gasto: 0 });

  for (const [f, dia_] of Object.entries(D.publi || {})) {
    if (f < desde || f > hasta) continue;
    for (const c of vals(dia_?.vendedores)) {
      let k = normVend(c?.nombre);
      if (!k || !(c.mensajes || c.gasto)) continue;
      // Campañas que no son de una vendedora:
      //  "Titan Mensajes Whatsapp" = publicidad del chatbot → su gasto va a Marcela
      //  (sus mensajes no se suman: Marcela ya cuenta cada chat que recibe, venga o no del anuncio)
      //  "Ventas …" = campañas de las landings → fila "Administrador" (los pedidos de landing los sube el administrador)
      const nomU = String(c?.nombre || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const esVend = D.usuarios.some((u) => normVend(u.nombrePubli || u.nombre) === k);
      const esBot = k === 'TITAN', esLanding = !esVend && !esBot && /\b(VENTAS|LANDING|CONTRAENTREGA)\b/.test(nomU);
      if (esBot) k = 'MARCELA'; else if (esLanding) k = 'ADMINISTRADOR';
      const o = get(k, esLanding ? 'Administrador' : esBot ? 'Marcela' : undefined), msj = esBot ? 0 : c.mensajes || 0;
      o.mensajes += msj; o.gasto += c.gasto || 0;
      const d = dia(o, f); d.mensajes += msj; d.gasto += c.gasto || 0;
    }
  }
  for (const p of D.pedidos || []) {
    if (!esVenta(p) || !p.fecha || p.fecha < desde || p.fecha > hasta) continue;
    let k = claveVendedor(p.vendedorNombre, p.vendedorId);
    if (!k) continue;
    const o = get(k, k === 'ADMINISTRADOR' ? 'Administrador' : String(p.vendedorNombre || k).split(/\s+/)[0]);
    o.ventas += 1; o.pares += paresDe(p); o.valor += Number(p.precioVenta) || 0;
    dia(o, p.fecha).ventas += 1;
  }
  // Marcela: conversaciones nuevas y ventas cerradas por el bot
  const bot = get('MARCELA', 'Marcela'); bot.bot = true;
  for (const [f, d] of Object.entries(D.bot || {})) {
    if (f < desde || f > hasta) continue;
    bot.mensajes += d.conversaciones || 0; bot.ventas += d.ventas || 0; bot.valor += d.valor || 0;
    const x = dia(bot, f); x.mensajes += d.conversaciones || 0; x.ventas += d.ventas || 0;
  }
  let lista = Object.values(V).filter((o) => o.mensajes || o.ventas || o.gasto || o.bot);
  if (!esAdmin()) {
    const yo = normVend(CU.nombrePubli || CU.nombre);
    lista = lista.filter((o) => o.clave === yo);
  }
  return lista.sort((a, b) => b.ventas - a.ventas || b.mensajes - a.mensajes);
}

function totales(l) {
  return l.reduce((t, o) => (t.mensajes += o.mensajes, t.ventas += o.ventas, t.gasto += o.gasto, t.valor += o.valor, t.pares += o.pares, t), { mensajes: 0, ventas: 0, gasto: 0, valor: 0, pares: 0 });
}

function semaforo(c) {
  if (c == null) return '<span class="pill n">—</span>';
  const cls = c >= 10 ? 'ok' : c >= 5 ? 'warn' : 'bad';
  return `<span class="pill ${cls}">${c.toFixed(1)}%</span>`;
}

function delta(a, b, invertir) {
  if (b == null || a == null || b === 0) return '';
  const d = (a - b) / b * 100; if (!isFinite(d)) return '';
  const bueno = invertir ? d < 0 : d > 0;
  return `<span class="${bueno ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(0)}%</span> vs periodo anterior`;
}

function renderVend() {
  const m = $('#main');
  if (D.pedidos == null) { m.innerHTML = '<div class="empty">Cargando ventas y publicidad…</div>'; return; }
  const [desde, hasta] = rangoFechas(RANGO), [pd, ph] = rangoPrevio(RANGO);
  const lista = agregar(desde, hasta), prev = agregar(pd, ph);
  const T = totales(lista), P = totales(prev);
  const conv = pct(T.ventas, T.mensajes), convP = pct(P.ventas, P.mensajes);
  const cpv = T.ventas ? T.gasto / T.ventas : null, cpvP = P.ventas ? P.gasto / P.ventas : null;

  const at = Number(D.publiEstado) || 0, horas = (Date.now() - at) / 3600000;

  const banner = !at
    ? `<div class="banner bad">⚠️ Aún no hay datos de Meta (flujo de n8n). Los mensajes salen en 0; las ventas sí son reales.</div>`
    : horas <= 3
      ? `<div class="banner ok"><span class="dot" style="background:var(--ok)"></span> Meta Ads vía n8n · actualizado ${cuando}</div>`
      : `<div class="banner bad">⚠️ Los datos de Meta no se actualizan desde ${cuando}. Revisa el flujo "Titán — Publicidad Flujo A" en n8n. Las ventas sí son reales.</div>`;

  if (!VSEL || !lista.find((o) => o.clave === VSEL)) VSEL = esAdmin() ? '__todos' : lista[0]?.clave;

  m.innerHTML = `
  <div class="row" style="justify-content:space-between">
    <h2>${esAdmin() ? 'Rendimiento de vendedores' : 'Mi rendimiento'}</h2>
    <div class="row">
      <div class="chips">${Object.entries(RANGOS).map(([k, [t]]) => `<button class="chip ${k === RANGO ? 'on' : ''}" onclick="setRango('${k}')">${t}</button>`).join('')}</div>
      ${esAdmin() ? `<button class="btn sm" ${ACT_META ? 'disabled' : ''} onclick="pedirMeta()">${ACT_META ? '⏳ Trayendo datos de Meta…' : '↻ Actualizar Meta'}</button>` : ''}
    </div>
  </div>
  <div style="margin-top:10px">${banner}</div>

  <div class="kpis">
    <div class="kpi"><div class="l">Mensajes</div><div class="v">${num(T.mensajes)}</div><div class="d">${delta(T.mensajes, P.mensajes)}</div></div>
    <div class="kpi"><div class="l">Ventas</div><div class="v">${num(T.ventas)}</div><div class="d">${num(T.pares)} pares${delta(T.ventas, P.ventas) ? ' · ' + delta(T.ventas, P.ventas) : ''}</div></div>
    <div class="kpi"><div class="l">Conversión</div><div class="v">${conv == null ? '—' : conv.toFixed(1) + '%'}</div><div class="d">${convP == null ? 'meta: 10%' : delta(conv, convP)}</div></div>
    ${esAdmin() ? `<div class="kpi"><div class="l">Gasto en pauta</div><div class="v">${pesos(T.gasto)}</div><div class="d">${delta(T.gasto, P.gasto, true)}</div></div>
    <div class="kpi"><div class="l">Costo por venta</div><div class="v">${cpv == null ? '—' : pesos(cpv)}</div><div class="d">${delta(cpv, cpvP, true)}</div></div>` : ''}
    <div class="kpi"><div class="l">Valor vendido</div><div class="v">${pesos(T.valor)}</div><div class="d">${delta(T.valor, P.valor)}</div></div>
  </div>

  <div class="tbl-wrap"><table>
    <thead><tr>${COLS.filter((c) => esAdmin() || !c.admin).map((c) => `<th class="ord" onclick="ordenar('${c.k}')">${c.t}${ORD.k === c.k ? (ORD.dir < 0 ? ' ▼' : ' ▲') : ''}</th>`).join('')}</tr></thead>
    <tbody>
      ${esAdmin() ? `<tr class="${VSEL === '__todos' ? 'sel' : ''}" onclick="selV('__todos')"><td><b>Todos</b></td><td>${num(T.mensajes)}</td><td>${num(T.ventas)}</td><td>${semaforo(conv)}</td><td>${pesos(T.gasto)}</td><td>${cpv == null ? '—' : pesos(cpv)}</td><td>${T.mensajes ? pesos(T.gasto / T.mensajes) : '—'}</td><td>${roasTxt(T.valor, T.gasto)}</td><td>${pesos(T.valor)}</td></tr>` : ''}
      ${ordenarLista(lista).map((o) => {
        const c = pct(o.ventas, o.mensajes);
        return `<tr class="${VSEL === o.clave ? 'sel' : ''}" onclick="selV('${o.clave}')">
          <td>${esc(o.nombre.charAt(0) + o.nombre.slice(1).toLowerCase())}${o.bot ? '<span class="bot-tag">BOT</span>' : ''}</td>
          <td>${num(o.mensajes)}</td><td>${num(o.ventas)}</td><td>${semaforo(c)}</td>
          ${esAdmin() ? `<td>${o.bot ? '—' : pesos(o.gasto)}</td><td>${o.ventas && o.gasto ? pesos(o.gasto / o.ventas) : '—'}</td><td>${o.mensajes && o.gasto ? pesos(o.gasto / o.mensajes) : '—'}</td><td>${o.bot ? '—' : roasTxt(o.valor, o.gasto)}</td>` : ''}
          <td>${pesos(o.valor)}</td></tr>`;
      }).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--muted)">Sin movimiento en este periodo</td></tr>`}
    </tbody>
  </table></div>
  <div class="note" style="margin-top:6px">Conversión = ventas ÷ mensajes. 🟢 10% o más · 🟡 5–10% · 🔴 menos de 5%. ROAS aprox. = valor vendido ÷ gasto (cuenta pedidos aún sin entregar; 🟢 3x o más · 🟡 2–3x · 🔴 menos de 2x). Toca un título para ordenar. Ventas = pedidos de bodega sin cancelados ni cambios. Toca una fila para ver su día a día.</div>

  <div class="section card">
    <div class="section-h"><h2 style="font-size:15px" id="chartTitle"></h2><div class="sp"></div>
      <div class="legend"><span><i style="background:#4b5563"></i>Mensajes</span><span><i style="background:var(--acc)"></i>Ventas</span><span><i style="background:var(--green);height:3px;border-radius:2px"></i>Conversión</span></div></div>
    <div id="chart"></div>
  </div>`;
  pintarGrafico();
}
const COLS = [
  { k: 'nombre', t: 'Vendedor' }, { k: 'mensajes', t: 'Mensajes' }, { k: 'ventas', t: 'Ventas' }, { k: 'conv', t: 'Conversión' },
  { k: 'gasto', t: 'Gasto', admin: true }, { k: 'cpv', t: 'Costo/venta', admin: true }, { k: 'cpm', t: 'Costo/mensaje', admin: true },
  { k: 'roas', t: 'ROAS aprox.', admin: true }, { k: 'valor', t: 'Valor' }];
let ORD = store.get('ctv_orden') || { k: 'ventas', dir: -1 };
function valCol(o, k) {
  if (k === 'nombre') return o.nombre;
  if (k === 'conv') return o.mensajes ? o.ventas / o.mensajes : -1;
  if (k === 'cpv') return o.ventas && o.gasto ? o.gasto / o.ventas : Infinity;
  if (k === 'cpm') return o.mensajes && o.gasto ? o.gasto / o.mensajes : Infinity;
  if (k === 'roas') return o.gasto ? o.valor / o.gasto : -1;
  return o[k] || 0;
}
function ordenarLista(l) {
  return [...l].sort((a, b) => {
    const x = valCol(a, ORD.k), y = valCol(b, ORD.k);
    return (typeof x === 'string' ? x.localeCompare(y) : (x > y ? 1 : x < y ? -1 : 0)) * ORD.dir;
  });
}
function ordenar(k) { ORD = { k, dir: ORD.k === k ? -ORD.dir : (k === 'nombre' || k === 'cpv' || k === 'cpm' ? 1 : -1) }; store.set('ctv_orden', ORD); renderVend(); }
function roasTxt(valor, gasto) {
  if (!gasto) return '—';
  const r = valor / gasto, cls = r >= 3 ? 'ok' : r >= 2 ? 'warn' : 'bad';
  return `<span class="pill ${cls}">${r.toFixed(1)}x</span>`;
}
function setRango(k) { RANGO = k; store.set('ctv_rango', k); renderVend(); }
function selV(k) { VSEL = k; renderVend(); }
let ACT_META = null; // { antes, t0 } mientras n8n trae los datos
function pedirMeta() {
  ACT_META = { antes: Number(D.publiEstado) || 0, t0: Date.now() }; (TAB === 'vend' && renderVend());
  fetch('https://titan331.app.n8n.cloud/webhook/titan-publicidad-refresh').catch(() => { ACT_META = null; (TAB === 'vend' && renderVend()); toast('No se pudo llamar a n8n'); });
  const vigilar = setInterval(() => {
    if (!ACT_META) return clearInterval(vigilar);
    if ((Number(D.publiEstado) || 0) > ACT_META.antes) {
      clearInterval(vigilar); ACT_META = null; (TAB === 'vend' && renderVend());
      toast('✓ Datos de Meta actualizados ' + new Date(Number(D.publiEstado)).toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' }));
    } else if (Date.now() - ACT_META.t0 > 90000) {
      clearInterval(vigilar); ACT_META = null; (TAB === 'vend' && renderVend()); toast('n8n no respondió en 90 s. Revisa el flujo "Titán — Publicidad Flujo A".');
    }
  }, 1000);
}

/** Día a día de los últimos 21 días: barras de mensajes y ventas + línea de conversión. */
function pintarGrafico() {
  const anchoCaja = $('#chart').clientWidth || 640, N = anchoCaja < 520 ? 14 : 21, dias = [];
  for (let i = N - 1; i >= 0; i--) dias.push(diasAtras(i));
  const lista = agregar(dias[0], dias[N - 1]);
  const sel = VSEL === '__todos' ? null : lista.find((o) => o.clave === VSEL);
  const fuente = sel ? [sel] : lista;
  $('#chartTitle').textContent = (sel ? `Día a día · ${sel.nombre.charAt(0) + sel.nombre.slice(1).toLowerCase()}` : 'Día a día · todos') + ` (${N} días)`;

  const serie = dias.map((f) => fuente.reduce((t, o) => { const d = o.dias[f]; if (d) { t.m += d.mensajes; t.v += d.ventas; } return t; }, { f, m: 0, v: 0 }));
  const W = Math.max(320, anchoCaja), H = 230, pl = 34, pr = 34, pt = 14, pb = 26;
  const iw = W - pl - pr, ih = H - pt - pb, bw = iw / N;
  const maxM = Math.max(1, ...serie.map((s) => Math.max(s.m, s.v)));
  const convs = serie.map((s) => pct(s.v, s.m));
  const maxC = Math.max(10, ...convs.filter((c) => c != null));
  const y = (v) => pt + ih - v / maxM * ih, yc = (c) => pt + ih - c / maxC * ih;

  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = maxM * k / 4, yy = y(v);
    g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="#262b35"/><text x="${pl - 6}" y="${yy + 3}" text-anchor="end">${Math.round(v)}</text><text x="${W - pr + 6}" y="${yc(maxC * k / 4) + 3}">${Math.round(maxC * k / 4)}%</text>`;
  }
  serie.forEach((s, i) => {
    const x = pl + i * bw, w = Math.max(3, Math.min(14, bw * 0.34));
    g += `<rect x="${x + bw / 2 - w - 1}" y="${y(s.m)}" width="${w}" height="${pt + ih - y(s.m)}" rx="3" fill="#4b5563"><title>${corto(s.f)}: ${s.m} mensajes</title></rect>`;
    g += `<rect x="${x + bw / 2 + 1}" y="${y(s.v)}" width="${w}" height="${pt + ih - y(s.v)}" rx="3" fill="var(--acc)"><title>${corto(s.f)}: ${s.v} ventas</title></rect>`;
    if ((N - 1 - i) % (W < 520 ? 3 : 2) === 0) g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${corto(s.f)}</text>`;
  });
  const pts = convs.map((c, i) => c == null ? null : [pl + i * bw + bw / 2, yc(c)]).filter(Boolean);
  if (pts.length > 1) g += `<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { g += `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--green)"/>`; });

  $('#chart').innerHTML = `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block">${g}</svg></div>`;
}

  if (!def) return '';

  return def.area
    ? `<textarea placeholder="${esc(def.ph)}" oninput="${onch}">${esc(valor)}</textarea>`
    : `<input placeholder="${esc(def.ph)}" value="${esc(valor)}" oninput="${onch}">`;
}

const COLORES = new Set(['negro','negra','blanco','blanca','gris','cafe','café','azul','oro','dorado','beige','avellana','miel','tabaco','verde','crema','coña','cona','tostado','rosa','fucsia','marron','marrón','vinotinto','camel','arena','plata','rojo','roja','amarillo','naranja','morado','lila','perla','hueso','chocolate','mostaza','petroleo','petróleo','todo']);
function partirNombre(nombre) {
  const tk = String(nombre || '').trim().split(/\s+/).filter(Boolean); const color = [];
  while (tk.length > 1) {
    const piezas = norm(tk[tk.length - 1].replace(/[-/]/g, ' ')).split(' ').filter(Boolean);
    if (piezas.length && piezas.every((p) => COLORES.has(p))) color.unshift(tk.pop()); else break;
  }
  return { modelo: tk.join(' ').trim(), color: color.join(' ') || 'único' };
}
let INV_Q = '';

    return;

  for (const p of vals(D.productos)) {
    if (!p || p.oculto) continue;
    const vs = vals(p.variantes).filter((v) => Number(v?.stockActual) > 0); if (!vs.length) continue;
    const { modelo, color } = partirNombre(p.nombre); if (!modelo) continue;
    if (!fam.has(modelo)) fam.set(modelo, { modelo, precios: [], colores: [], unidades: 0, foto: false });
    const f = fam.get(modelo); const st = {};
    vs.forEach((v) => { const t = String(v.talla || '').trim() || 'única'; st[t] = (st[t] || 0) + Number(v.stockActual); if (Number(v.precio) > 0) f.precios.push(Number(v.precio)); });
    const u = vs.reduce((s, v) => s + Number(v.stockActual), 0);

      <div class="note">${f.unidades} pares</div>

function tomarChat(k) {

const leerDataUrl = (blob) => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = mal; r.readAsDataURL(blob); });
async function comprimirImagen(file, max = 1600, calidad = 0.85) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
  const esc_ = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * esc_); cv.height = Math.round(img.height * esc_);

}
/* ---------- Bandeja de adjuntos: hasta 10 fotos/videos/archivos antes de enviar ---------- */
const PEND = {}; // chat -> [{ tipo, dataUrl?, file?, nombre, vista }]
const MAX_ADJ = 10, MAX_VIDEO_MB = 60;
async function adjuntar(files) {
  if (!CHAT || !files?.length) return;
  const k = CHAT, lista = (PEND[k] = PEND[k] || []);
  let saltados = 0;
  for (const file of files) {
    if (lista.length >= MAX_ADJ) { saltados++; continue; }
    try {
      if (/^image\//.test(file.type)) { const d = await comprimirImagen(file); lista.push({ tipo: 'image', dataUrl: d, nombre: file.name, vista: d }); }
      else if (/^video\//.test(file.type)) {
        if (file.size > MAX_VIDEO_MB * 1024 * 1024) { toast(`El video ${file.name} pesa más de ${MAX_VIDEO_MB} MB`); continue; }
        lista.push({ tipo: 'video', file, nombre: file.name, vista: URL.createObjectURL(file) });
      } else {
        if (file.size > 15 * 1024 * 1024) { toast(`${file.name} pesa más de 15 MB`); continue; }
        lista.push({ tipo: /^audio\//.test(file.type) ? 'audio' : 'document', file, nombre: file.name });
      }
    } catch (e) { toast('No se pudo leer ' + file.name); }
  }
  if (saltados) toast(`Máximo ${MAX_ADJ} por envío: ${saltados} no se agregaron`);
  renderChats(); $('#resp')?.focus();
}
function quitarAdj(i) { const l = PEND[CHAT] || []; const x = l.splice(i, 1)[0]; if (x?.vista && x.file) URL.revokeObjectURL(x.vista); renderChats(); }
function bandejaHTML() {

      <button onclick="quitarAdj(${i})" title="Quitar">✕</button></div>`).join('')}
    ${l.length < MAX_ADJ ? `<button class="adj mas" onclick="$('#adj').click()" title="Agregar más">＋</button>` : ''}

/* Sube un adjunto. Lo pesado (videos, archivos > 6 MB) va en pedazos a ctv/adjuntos y el mensaje solo lleva la referencia. */
async function empujarAdjunto(k, x, texto) {
  const dataUrl = x.dataUrl || await leerDataUrl(x.file);
  const base = { direccion: 'out', estadoEnvio: 'pendiente', tipo: x.tipo, nombreArchivo: x.nombre || null, texto: texto || null,
    autor: CU.nombre, timestamp: Date.now(), creadoAt: firebase.database.ServerValue.TIMESTAMP, ...citaActual() };
  if (dataUrl.length < 6 * 1024 * 1024 && x.tipo !== 'video') {
    await db.ref(`${R}/conversaciones/${k}/mensajes`).push({ ...base, archivoDataUrl: dataUrl });
  } else {
    const coma = dataUrl.indexOf(','), mime = dataUrl.slice(5, dataUrl.indexOf(';')), b64 = dataUrl.slice(coma + 1);
    const ref = db.ref(`${R}/ctv/adjuntos`).push(), PED = 4 * 1024 * 1024, n = Math.ceil(b64.length / PED);
    toast(`Subiendo ${x.tipo === 'video' ? 'video' : 'archivo'}… 0/${n}`);
    await ref.set({ mime, por: CU.nombre, creadoAt: Date.now(), completo: false });
    for (let i = 0; i < n; i++) { await ref.child(`partes/${i}`).set(b64.slice(i * PED, (i + 1) * PED)); toast(`Subiendo ${x.tipo === 'video' ? 'video' : 'archivo'}… ${i + 1}/${n}`); }
    await ref.child('completo').set(true);
    await db.ref(`${R}/conversaciones/${k}/mensajes`).push({ ...base, archivoRef: ref.key });
  }
  if (x.vista && x.file) URL.revokeObjectURL(x.vista);
  tomarChat(k);
}
/* ---------- Nota de voz: mantener presionado, deslizar a la izquierda para cancelar ---------- */
let GRAB = null;
function armarMic() {
  const b = $('#btn-mic'); if (!b) return;
  b.addEventListener('pointerdown', micAbajo);
  b.addEventListener('contextmenu', (e) => e.preventDefault());
}
async function micAbajo(e) {
  e.preventDefault();
  if (GRAB) return;
  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') return toast('Este navegador no permite grabar audio');
  const btn = e.currentTarget, x0 = e.clientX, k = CHAT;
  try { btn.setPointerCapture(e.pointerId); } catch (_) {}
  GRAB = { k, x0, cancel: false, suelto: false, t0: Date.now(), btn };
  const barra = document.createElement('div'); barra.className = 'grabbar';
  barra.innerHTML = '<span class="punto"></span><span id="gtiempo">0:00</span><span class="desliza">‹ Desliza para cancelar</span>';
  $('.cview')?.appendChild(barra); GRAB.barra = barra; btn.classList.add('grabando');
  GRAB.reloj = setInterval(() => { const sg = Math.floor((Date.now() - GRAB.t0) / 1000); const el = $('#gtiempo'); if (el) el.textContent = `${Math.floor(sg / 60)}:${String(sg % 60).padStart(2, '0')}`; }, 250);
  const mover = (ev) => {
    if (!GRAB) return;
    const dx = Math.min(0, ev.clientX - x0);
    const d = barra.querySelector('.desliza'); if (d) d.style.transform = `translateX(${Math.max(dx * .6, -70)}px)`;
    GRAB.cancel = dx < -110; barra.classList.toggle('cancelar', GRAB.cancel);
    if (GRAB.cancel && d) d.textContent = '🗑 Suelta para borrar';
    else if (d) d.textContent = '‹ Desliza para cancelar';
  };
  const soltar = () => {
    btn.removeEventListener('pointermove', mover); btn.removeEventListener('pointerup', soltar); btn.removeEventListener('pointercancel', soltar);
    if (!GRAB) return; GRAB.suelto = true;
    if (GRAB.rec && GRAB.rec.state !== 'inactive') GRAB.rec.stop(); else if (!GRAB.rec) {} // aún pidiendo permiso: se cierra al llegar
  };
  btn.addEventListener('pointermove', mover); btn.addEventListener('pointerup', soltar); btn.addEventListener('pointercancel', soltar);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const tipo = ['audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/mp4'].find((t) => MediaRecorder.isTypeSupported(t)) || '';
    const rec = new MediaRecorder(stream, tipo ? { mimeType: tipo } : undefined);
    const partes = [];
    rec.ondataavailable = (ev) => ev.data.size && partes.push(ev.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      const g = GRAB; terminarGrab();
      if (g.cancel) return toast('Nota de voz descartada');
      if (Date.now() - g.t0 < 1000) return toast('Mantén presionado el micrófono mientras hablas');
      const blob = new Blob(partes, { type: rec.mimeType || tipo || 'audio/webm' });
      empujarArchivo(g.k, 'audio', await leerDataUrl(blob), null, null);
    };
    if (GRAB.suelto) { // soltó mientras aceptaba el permiso
      stream.getTracks().forEach((t) => t.stop()); terminarGrab(); return toast('Ya puedes grabar: mantén presionado el micrófono');
    }
    GRAB.t0 = Date.now(); GRAB.rec = rec; rec.start();
  } catch (err) { terminarGrab(); toast('No se pudo usar el micrófono: ' + err.message); }
}
function terminarGrab() {
  if (!GRAB) return;
  clearInterval(GRAB.reloj); GRAB.barra?.remove();
  if (GRAB.btn) { GRAB.btn.classList.remove('grabando'); GRAB.btn.style.transform = ''; }
  const pend = GRAB.pend; GRAB = null;
  if (pend) renderChats();
}

    <div class="grid2">${inp('direccion', cl.destinoTipo === 'oficina' ? 'Dirección (opcional)' : 'Dirección *')}${cl.destinoTipo === 'oficina' ? inp('empresa', 'Oficina / transportadora', 'Interrapidísimo') : '<div></div>'}</div>
    ${inp('notas', 'Notas')}
    <div class="err" id="subir-err"></div>
    <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn ghost" onclick="SUB=null;pintarSubir()">Cancelar</button>
      <button class="btn pri" ${SUB.enviando ? 'disabled' : ''} onclick="enviarSubir()">${SUB.enviando ? 'Subiendo…' : 'Subir a bodega'}</button></div>
  </div>`;
}
function enviarSubir() {
  const e = $('#subir-err'), cl = SUB.cli;
  const p = D.productos?.[SUB.pid], v = p && vals(p.variantes).find((x) => x.id === SUB.vid);
  const falta = !p ? 'Elige el producto' : !v ? 'Elige la talla' : !cl.nombre.trim() ? 'Falta el nombre' : cl.telefono.replace(/\D/g, '').length < 10 ? 'El celular debe tener 10 dígitos'
    : !cl.ciudad.trim() ? 'Falta la ciudad' : cl.destinoTipo === 'domicilio' && !cl.direccion.trim() ? 'Falta la dirección'
    : cl.destinoTipo === 'oficina' && !cl.cedula.replace(/\D/g, '') ? 'Para oficina la cédula es obligatoria' : !Number(SUB.precio) ? 'Falta el precio' : '';
  if (falta) { e.textContent = falta; return; }
  SUB.enviando = true; pintarSubir();
  const ref = db.ref(`${R}/ctv/solicitudesPedido`).push();
  const k = SUB.k;
  ref.set({ waId: k, vendedorId: CU.id, vendedorNombre: CU.nombre, formaPago: SUB.formaPago, precioTotal: Number(SUB.precio),
    items: [{ pid: SUB.pid, vid: SUB.vid, talla: v.talla, color: v.color || '', cantidad: SUB.cantidad, precioVenta: Math.round(Number(SUB.precio) / SUB.cantidad) }],
    cliente: { ...cl, telefono: cl.telefono.replace(/\D/g, '').slice(-10), cedula: cl.cedula.replace(/\D/g, '') }, creadoAt: firebase.database.ServerValue.TIMESTAMP });
  const t0 = Date.now();
  const off = ref.on('value', (s) => {
    const r = s.val() || {};
    if (r.estado === 'ok') { ref.off('value', off); SUB = null; pintarSubir(); toast(`✅ Pedido #${String(r.pedidoId).slice(-6)} subido a bodega${r.backorder ? ' (con pares por reponer)' : ''}`); }
    else if (r.estado === 'error') { ref.off('value', off); SUB.enviando = false; pintarSubir(); $('#subir-err').textContent = '⚠️ ' + r.motivo; }
    else if (Date.now() - t0 > 45000) { ref.off('value', off); SUB.enviando = false; pintarSubir(); $('#subir-err').textContent = 'La bodega no respondió. Revisa en la app si quedó antes de reintentar.'; }
  });
}

/* ---------- Conexión: aviso si se cae y reintento si tarda en cargar ---------- */
let LENTO = false;
setTimeout(() => { if (D.convs == null) { LENTO = true; if (TAB === 'chats') renderChats(); } }, 12000);
db.ref('.info/connected').on('value', (s) => {

/* ---------- Etiquetas y recordatorios por chat (mantener presionado en la lista) ---------- */
const ETIQ_BASE = [
  { id: 'interesado', nombre: '🔥 Interesado', color: '#f59e0b' }, { id: 'precio', nombre: '💲 Pidió precio', color: '#3b82f6' },
  { id: 'pago', nombre: '💳 Espera pago', color: '#8b5cf6' }, { id: 'volver', nombre: '🔁 Volver a escribir', color: '#ef4444' },
  { id: 'frecuente', nombre: '⭐ Cliente frecuente', color: '#10b981' }, { id: 'mayorista', nombre: '📦 Mayorista', color: '#14b8a6' },
];
function listaEtiquetas() {
  const extra = Object.entries(D.etiquetas || {}).map(([id, e]) => ({ id, ...e })).filter((e) => e.nombre);
  return [...ETIQ_BASE.filter((b) => !(D.etiquetas || {})[b.id]?.oculta), ...extra.filter((e) => !ETIQ_BASE.some((b) => b.id === e.id))];
}
// Chats que solo existen porque se avisó la guía: la venta se habló por el
// WhatsApp propio del vendedor, aquí nunca hubo conversación.
function soloAvisoGuia(c) { return c.fuente === 'guia_vendedor'; }

// Etiquetas que archivan: el chat sale de la lista y solo se ve entrando a su filtro.
function normEt(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]/gi, '').toLowerCase(); }
function etArchiva(e) { return e.archiva === true || normEt(e.nombre) === 'basura'; }
function idsQueArchivan() { return listaEtiquetas().filter(etArchiva).map((e) => e.id); }

function etiquetasHTML(x) {
  return listaEtiquetas().filter((e) => x.etiquetas?.[e.id]).map((e) => `<span class="badge et" style="--c:${e.color || '#64748b'}">${esc(e.nombre)}</span>`).join('');
}
function cuandoTxt(at) {
  const d = new Date(at), hoy = fechaCo(new Date()), dia = fechaCo(d), man = fechaCo(new Date(Date.now() + 86400000));
  const h = d.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Bogota' });
  return dia === hoy ? 'hoy ' + h : dia === man ? 'mañana ' + h : d.toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'America/Bogota' }) + ' ' + h;
}
function recordatorioHTML(x) {
  const r = x.recordatorio; if (!r?.at) return '';
  const vencido = r.at <= Date.now();
  return `<span class="badge ${vencido ? 'rv' : 'rc'}" title="${esc(r.nota || '')}">⏰ ${vencido ? 'Escribirle ya' : cuandoTxt(r.at)}</span>`;
}
const PRESION = { t: null, hecho: false };
function presionar(e, k) {
  PRESION.hecho = false; clearTimeout(PRESION.t);
  PRESION.x = e.clientX; PRESION.y = e.clientY;
  PRESION.t = setTimeout(() => { PRESION.hecho = true; navigator.vibrate?.(30); menuChat(k); setTimeout(() => (PRESION.hecho = false), 600); }, 550);
}
function soltarPresion() { clearTimeout(PRESION.t); }
addEventListener('pointermove', (e) => { if (PRESION.t && (Math.abs(e.clientX - PRESION.x) > 10 || Math.abs(e.clientY - PRESION.y) > 10)) clearTimeout(PRESION.t); }, { passive: true });
let MENU = null;
function menuChat(k) {
  const c = D.convs[k]; if (!c) return;
  MENU = { k, nota: c.recordatorio?.nota || '' };
  pintarMenu();
}
function cerrarMenu() { MENU = null; $('#menuChat')?.remove(); }
function pintarMenu() {
  if (!MENU) return; const c = D.convs[MENU.k] || {}, r = c.recordatorio;
  let el = $('#menuChat'); if (!el) { el = document.createElement('div'); el.id = 'menuChat'; document.body.appendChild(el); }
  const nom = c.datos?.nombre || c.nombre || '+' + MENU.k;
  el.innerHTML = `<div class="hoja-fondo" onclick="cerrarMenu()"></div><div class="hoja">
    <div class="hoja-t"><b>${esc(nom)}</b><button class="wabtn" onclick="cerrarMenu()">✕</button></div>
    <div class="hoja-s">Etiquetas</div>
    <div class="etqs">${listaEtiquetas().map((e) => `<button class="etq ${c.etiquetas?.[e.id] ? 'on' : ''}" style="--c:${e.color || '#64748b'}" onclick="togEtiqueta('${MENU.k}','${e.id}')">${esc(e.nombre)}</button>`).join('')}
      ${esAdmin() ? '<button class="etq mas" onclick="nuevaEtiqueta()">＋ Nueva</button>' : ''}</div>
    <div class="hoja-s">⏰ Recordarme escribirle ${r?.at ? `<span class="note">· ${r.at <= Date.now() ? 'vencido' : cuandoTxt(r.at)}</span>` : ''}</div>
    <div class="recs">${[['1 h', 1], ['3 h', 3], ['Mañana 9 am', 'm9'], ['2 días', 48], ['3 días', 72], ['1 semana', 168]].map(([t, v]) => `<button class="etq" onclick="ponerRecordatorio('${v}')">${t}</button>`).join('')}</div>
    <div class="row" style="gap:6px;margin-top:8px;flex-wrap:nowrap">
      <input id="recD" type="number" min="0" inputmode="numeric" placeholder="Días" style="width:72px"><input id="recH" type="number" min="0" inputmode="numeric" placeholder="Horas" style="width:72px">
      <button class="btn sm pri" onclick="ponerRecordatorio('custom')">Programar</button></div>
    <input id="recN" placeholder="Nota (opcional): ej. confirmar talla" value="${esc(MENU.nota)}" oninput="MENU.nota=this.value" style="margin-top:8px">
    ${r?.at ? `<button class="btn sm ghost" style="margin-top:8px" onclick="quitarRecordatorio()">Quitar recordatorio</button>` : ''}
    <div class="row" style="margin-top:12px"><button class="btn" style="flex:1" onclick="const k=MENU.k;cerrarMenu();abrirChat(k)">Abrir chat</button>
      ${c.noLeidos ? '' : `<button class="btn" style="flex:1" onclick="db.ref('${R}/conversaciones/${MENU.k}/noLeidos').set(1);cerrarMenu()">Marcar no leído</button>`}</div>
  </div>`;
}
function togEtiqueta(k, id) {
  const on = !D.convs[k]?.etiquetas?.[id];
  db.ref(`${R}/conversaciones/${k}/etiquetas/${id}`).set(on || null).then(() => pintarMenu()).catch((e) => toast('No se pudo: ' + e.message));
}
function nuevaEtiqueta() {
  const n = prompt('Nombre de la etiqueta (puedes iniciar con un emoji):'); if (!n || !n.trim()) return;
  const colores = ['#f97316', '#06b6d4', '#a855f7', '#22c55e', '#e11d48', '#eab308'];
  db.ref(`${R}/config/etiquetas`).push({ nombre: n.trim().slice(0, 30), color: colores[Math.floor(Math.random() * colores.length)] }).then(() => setTimeout(pintarMenu, 300));
}
function ponerRecordatorio(v) {
  if (!MENU) return;
  let at;
  if (v === 'm9') { const d = new Date(Date.now() + 86400000); const f = fechaCo(d); at = new Date(f + 'T09:00:00-05:00').getTime(); }
  else if (v === 'custom') { const dd = Number($('#recD').value) || 0, hh = Number($('#recH').value) || 0; if (!dd && !hh) return toast('Pon días u horas'); at = Date.now() + (dd * 24 + hh) * 3600000; }
  else at = Date.now() + Number(v) * 3600000;
  const k = MENU.k;
  db.ref(`${R}/conversaciones/${k}`).update({ recordatorio: { at, nota: (MENU.nota || '').trim() || null, porId: CU.id, porNombre: CU.nombre, creadoAt: Date.now() }, recordatorioAt: at })
    .then(() => { toast('⏰ Te aviso ' + cuandoTxt(at)); cerrarMenu(); }).catch((e) => toast('No se pudo: ' + e.message));
}
function quitarRecordatorio() {
  const k = MENU.k;
  db.ref(`${R}/conversaciones/${k}`).update({ recordatorio: null, recordatorioAt: null }).then(() => { toast('Recordatorio quitado'); cerrarMenu(); });
}

/* ---------- Notificaciones (Web Push). En iPhone solo funcionan con la app agregada a la pantalla de inicio. ---------- */

const AVISOS = { estado: 'off' }; // off | on | bloqueado | noapto | ios
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent), esApp = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
async function revisarAvisos() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) AVISOS.estado = esIOS && !esApp ? 'ios' : 'noapto';
  else if (Notification.permission === 'denied') AVISOS.estado = 'bloqueado';
  else {
    const reg = await navigator.serviceWorker.register('sw.js').catch(() => null);
    const sub = reg && (await reg.pushManager.getSubscription());
    AVISOS.estado = sub && Notification.permission === 'granted' ? 'on' : 'off';
    if (sub && CU) guardarSub(sub); // renueva la suscripción de este dispositivo
  }
  pintarAvisos();
}
function botonAvisos() {
  const e = AVISOS.estado;
  if (e === 'on') return '';
  const t = { off: '🔔 Activar avisos', bloqueado: '🔕 Avisos bloqueados', ios: '🔔 Avisos', noapto: '' }[e];
  return t ? `<button class="btn sm avisos" onclick="activarAvisos()">${t}</button>` : '';
}
function pintarAvisos() { const h = $('#avisosHdr'); if (h) h.innerHTML = botonAvisos(); if (TAB === 'chats' && !CHAT) renderChats(); }
const b64aBytes = (b) => { const p = '='.repeat((4 - (b.length % 4)) % 4), s = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...s].map((c) => c.charCodeAt(0))); };
async function idDispositivo(sub) { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(sub.endpoint)); return [...new Uint8Array(h)].slice(0, 10).map((x) => x.toString(16).padStart(2, '0')).join(''); }
async function guardarSub(sub) {
  const id = await idDispositivo(sub);
  return db.ref(`${R}/ctv/push/${CU.id}/${id}`).set({ sub: JSON.parse(JSON.stringify(sub)), ua: navigator.userAgent.slice(0, 120), at: Date.now() });
}
/* La clave pública la crea el servidor la primera vez; si aún no existe, se le pide y se espera */
async function clavePublica() {
  const ref = db.ref(`${R}/config/push/publica`);
  let k = (await ref.once('value')).val(); if (k) return k;
  await db.ref(`${R}/ctv/pushPrueba`).push({ at: Date.now() });
  for (let i = 0; i < 20 && !k; i++) { await new Promise((r) => setTimeout(r, 1500)); k = (await ref.once('value')).val(); }
  if (!k) throw new Error('el servidor no respondió; intenta de nuevo en un minuto');
  return k;
}
async function activarAvisos() {
  if (AVISOS.estado === 'ios') return alert('En iPhone: toca Compartir (el cuadrado con flecha) → "Agregar a inicio". Abre Cierra tu Venta desde ese ícono y toca otra vez "Activar avisos".');
  if (AVISOS.estado === 'bloqueado') return alert('Las notificaciones están bloqueadas para esta página. Actívalas en los ajustes del navegador (candado junto a la dirección → Notificaciones → Permitir) y recarga.');
  try {
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted') { AVISOS.estado = permiso === 'denied' ? 'bloqueado' : 'off'; return pintarAvisos(); }
    const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
    const publica = await clavePublica();
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64aBytes(publica) }));
    await guardarSub(sub);
    await db.ref(`${R}/ctv/pushPrueba`).push({ usuarioId: CU.id, at: Date.now() });
    AVISOS.estado = 'on'; pintarAvisos(); toast('🔔 Avisos activados en este dispositivo');
  } catch (e) { toast('No se pudieron activar los avisos: ' + e.message); }
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data?.abrirChat && CU) { ir('chats'); abrirChat(e.data.abrirChat); } });
}
