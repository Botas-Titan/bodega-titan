name: Publicar app (Firebase Hosting + GitHub Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reescribe APP_VERSION con la fecha/hora del despliegue. Sin esto, las
      # pestanas ya abiertas seguirian ejecutando el codigo anterior y
      # escribirian el inventario con la version vieja (causa de los
      # descuadres de stock).
      - name: Inyectar version
        run: |
          set -e
          VER=$(date -u +'%Y.%m.%d.%H%M')
          FILE=$(grep -rl "^const APP_VERSION = '" --include=index.html . | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::No se encontro ningun index.html con APP_VERSION"; exit 1
          fi
          sed -i "s/^const APP_VERSION = '[^']*';/const APP_VERSION = '$VER';/" "$FILE"
          grep -q "const APP_VERSION = '$VER';" "$FILE" \
            || { echo "::error::No se pudo inyectar APP_VERSION en $FILE"; exit 1; }
          echo "Version publicada: $VER  ($FILE)"

      # --- Destino principal: Firebase Hosting (sitio bodega-titan-app) ---
      - name: Desplegar a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: bodegatitan-2d932
          channelId: live

      # --- Destino de respaldo: GitHub Pages ---
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'BODEGA TITAN'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
